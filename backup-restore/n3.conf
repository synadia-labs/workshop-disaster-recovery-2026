# n3: node 3 of the 3-node cluster 'demo' used for the backup and restore demo.
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: n3
listen: 127.0.0.1:4103
http: 127.0.0.1:8103

pid_file: "./data/n3.pid"
log_file: "./data/n3.log"

jetstream {
  store_dir: "./data/n3"
}

cluster {
  name: demo
  listen: 127.0.0.1:6103
  routes: [ nats-route://127.0.0.1:6101, nats-route://127.0.0.1:6102, nats-route://127.0.0.1:6103 ]
}

include ./accounts.conf
