# n1: node 1 of the 3-node cluster 'demo' used for the backup and restore demo.
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: n1
listen: 127.0.0.1:4101
http: 127.0.0.1:8101

pid_file: "./data/n1.pid"
log_file: "./data/n1.log"

jetstream {
  store_dir: "./data/n1"
}

cluster {
  name: demo
  listen: 127.0.0.1:6101
  routes: [ nats-route://127.0.0.1:6101, nats-route://127.0.0.1:6102, nats-route://127.0.0.1:6103 ]
}

include ./accounts.conf
