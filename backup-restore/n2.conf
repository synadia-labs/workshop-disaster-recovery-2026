# n2: node 2 of the 3-node cluster 'demo' used for the backup and restore demo.
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: n2
listen: 127.0.0.1:4102
http: 127.0.0.1:8102

pid_file: "./data/n2.pid"
log_file: "./data/n2.log"

jetstream {
  store_dir: "./data/n2"
}

cluster {
  name: demo
  listen: 127.0.0.1:6102
  routes: [ nats-route://127.0.0.1:6101, nats-route://127.0.0.1:6102, nats-route://127.0.0.1:6103 ]
}

include ./accounts.conf
