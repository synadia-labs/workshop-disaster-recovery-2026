# stretch-central: node of the 'stretch' cluster that, in a real deployment, runs in the central region
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: stretch-central
listen: 127.0.0.1:4142
http: 127.0.0.1:8142

pid_file: "./data/stretch-central.pid"
log_file: "./data/stretch-central.log"

jetstream {
  store_dir: "./data/stretch-central"
}

cluster {
  name: stretch
  listen: 127.0.0.1:6142
  routes: [
    nats-route://127.0.0.1:6141
    nats-route://127.0.0.1:6142
    nats-route://127.0.0.1:6143
  ]
}

gateway {
  name: stretch
  listen: 127.0.0.1:7142
  # what other clusters are told to connect to: the gwproxy port in front of this listener
  advertise: 127.0.0.1:9142
  include ./gateways.conf
}

include ./accounts.conf
