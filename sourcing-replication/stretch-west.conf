# stretch-west: node of the 'stretch' cluster that, in a real deployment, runs in the west region
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: stretch-west
listen: 127.0.0.1:4143
http: 127.0.0.1:8143

pid_file: "./data/stretch-west.pid"
log_file: "./data/stretch-west.log"

jetstream {
  store_dir: "./data/stretch-west"
}

cluster {
  name: stretch
  listen: 127.0.0.1:6143
  routes: [
    nats-route://127.0.0.1:6141
    nats-route://127.0.0.1:6142
    nats-route://127.0.0.1:6143
  ]
}

gateway {
  name: stretch
  listen: 127.0.0.1:7143
  # what other clusters are told to connect to: the gwproxy port in front of this listener
  advertise: 127.0.0.1:9143
  include ./gateways.conf
}

include ./accounts.conf
