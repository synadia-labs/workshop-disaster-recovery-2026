# central-2: node 2 of cluster 'central'
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: central-2
listen: 127.0.0.1:4132
http: 127.0.0.1:8132

pid_file: "./data/central-2.pid"
log_file: "./data/central-2.log"

jetstream {
  store_dir: "./data/central-2"
}

cluster {
  name: central
  listen: 127.0.0.1:6132
  routes: [
    nats-route://127.0.0.1:6131
    nats-route://127.0.0.1:6132
    nats-route://127.0.0.1:6133
  ]
}

gateway {
  name: central
  listen: 127.0.0.1:7132
  # what other clusters are told to connect to: the gwproxy port in front of this listener
  advertise: 127.0.0.1:9132
  include ./gateways.conf
}

include ./accounts.conf
