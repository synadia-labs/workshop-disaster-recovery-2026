# Accounts shared by every server of the super-cluster.
#   app/app  -> APP account (JetStream enabled), also used when no credentials are given
#   sys/sys  -> system account, needed for `nats server ...` commands
#
# The APP account carries the cluster-scoped subject mappings that turn the three real
# stream pairs (foo-write-<region> / foo-read-<region>) into one "virtual stream" called
# foo: clients publish to foo.> and use the JetStream API with stream name foo, and the
# mapping active in the cluster they are connected to rewrites that to the local streams.
# The stretch cluster has no mapping: it hosts no part of the virtual stream.
# In operator mode these mappings live in the account JWT instead.
accounts {
  SYS: {
    users: [ { user: sys, password: sys } ]
  }
  APP: {
    jetstream: enabled
    users: [ { user: app, password: app } ]
    mappings {
      # writes: a publish to foo.x in west lands in foo-write-west (subject foo.west.x)
      "foo.>": [
        { destination: "foo.west.>", weight: 100%, cluster: west }
        { destination: "foo.east.>", weight: 100%, cluster: east }
        { destination: "foo.central.>", weight: 100%, cluster: central }
      ]
      # reads and consumers: every JetStream API subject that carries the stream name
      "$JS.API.STREAM.INFO.foo": [
        { destination: "$JS.API.STREAM.INFO.foo-read-west", weight: 100%, cluster: west }
        { destination: "$JS.API.STREAM.INFO.foo-read-east", weight: 100%, cluster: east }
        { destination: "$JS.API.STREAM.INFO.foo-read-central", weight: 100%, cluster: central }
      ]
      "$JS.API.CONSUMER.CREATE.foo.>": [
        { destination: "$JS.API.CONSUMER.CREATE.foo-read-west.>", weight: 100%, cluster: west }
        { destination: "$JS.API.CONSUMER.CREATE.foo-read-east.>", weight: 100%, cluster: east }
        { destination: "$JS.API.CONSUMER.CREATE.foo-read-central.>", weight: 100%, cluster: central }
      ]
      "$JS.API.CONSUMER.DURABLE.CREATE.foo.*": [
        { destination: "$JS.API.CONSUMER.DURABLE.CREATE.foo-read-west.{{wildcard(1)}}", weight: 100%, cluster: west }
        { destination: "$JS.API.CONSUMER.DURABLE.CREATE.foo-read-east.{{wildcard(1)}}", weight: 100%, cluster: east }
        { destination: "$JS.API.CONSUMER.DURABLE.CREATE.foo-read-central.{{wildcard(1)}}", weight: 100%, cluster: central }
      ]
      "$JS.API.CONSUMER.INFO.foo.*": [
        { destination: "$JS.API.CONSUMER.INFO.foo-read-west.{{wildcard(1)}}", weight: 100%, cluster: west }
        { destination: "$JS.API.CONSUMER.INFO.foo-read-east.{{wildcard(1)}}", weight: 100%, cluster: east }
        { destination: "$JS.API.CONSUMER.INFO.foo-read-central.{{wildcard(1)}}", weight: 100%, cluster: central }
      ]
      "$JS.API.CONSUMER.DELETE.foo.*": [
        { destination: "$JS.API.CONSUMER.DELETE.foo-read-west.{{wildcard(1)}}", weight: 100%, cluster: west }
        { destination: "$JS.API.CONSUMER.DELETE.foo-read-east.{{wildcard(1)}}", weight: 100%, cluster: east }
        { destination: "$JS.API.CONSUMER.DELETE.foo-read-central.{{wildcard(1)}}", weight: 100%, cluster: central }
      ]
      "$JS.API.CONSUMER.LIST.foo": [
        { destination: "$JS.API.CONSUMER.LIST.foo-read-west", weight: 100%, cluster: west }
        { destination: "$JS.API.CONSUMER.LIST.foo-read-east", weight: 100%, cluster: east }
        { destination: "$JS.API.CONSUMER.LIST.foo-read-central", weight: 100%, cluster: central }
      ]
      "$JS.API.CONSUMER.NAMES.foo": [
        { destination: "$JS.API.CONSUMER.NAMES.foo-read-west", weight: 100%, cluster: west }
        { destination: "$JS.API.CONSUMER.NAMES.foo-read-east", weight: 100%, cluster: east }
        { destination: "$JS.API.CONSUMER.NAMES.foo-read-central", weight: 100%, cluster: central }
      ]
      "$JS.API.CONSUMER.MSG.NEXT.foo.*": [
        { destination: "$JS.API.CONSUMER.MSG.NEXT.foo-read-west.{{wildcard(1)}}", weight: 100%, cluster: west }
        { destination: "$JS.API.CONSUMER.MSG.NEXT.foo-read-east.{{wildcard(1)}}", weight: 100%, cluster: east }
        { destination: "$JS.API.CONSUMER.MSG.NEXT.foo-read-central.{{wildcard(1)}}", weight: 100%, cluster: central }
      ]
      "$JS.API.STREAM.MSG.GET.foo": [
        { destination: "$JS.API.STREAM.MSG.GET.foo-read-west", weight: 100%, cluster: west }
        { destination: "$JS.API.STREAM.MSG.GET.foo-read-east", weight: 100%, cluster: east }
        { destination: "$JS.API.STREAM.MSG.GET.foo-read-central", weight: 100%, cluster: central }
      ]
      "$JS.API.DIRECT.GET.foo": [
        { destination: "$JS.API.DIRECT.GET.foo-read-west", weight: 100%, cluster: west }
        { destination: "$JS.API.DIRECT.GET.foo-read-east", weight: 100%, cluster: east }
        { destination: "$JS.API.DIRECT.GET.foo-read-central", weight: 100%, cluster: central }
      ]
      "$JS.API.DIRECT.GET.foo.>": [
        { destination: "$JS.API.DIRECT.GET.foo-read-west.>", weight: 100%, cluster: west }
        { destination: "$JS.API.DIRECT.GET.foo-read-east.>", weight: 100%, cluster: east }
        { destination: "$JS.API.DIRECT.GET.foo-read-central.>", weight: 100%, cluster: central }
      ]
      "$JS.API.STREAM.MSG.DELETE.foo": [
        { destination: "$JS.API.STREAM.MSG.DELETE.foo-read-west", weight: 100%, cluster: west }
        { destination: "$JS.API.STREAM.MSG.DELETE.foo-read-east", weight: 100%, cluster: east }
        { destination: "$JS.API.STREAM.MSG.DELETE.foo-read-central", weight: 100%, cluster: central }
      ]
      "$JS.ACK.foo.>": [
        { destination: "$JS.ACK.foo-read-west.>", weight: 100%, cluster: west }
        { destination: "$JS.ACK.foo-read-east.>", weight: 100%, cluster: east }
        { destination: "$JS.ACK.foo-read-central.>", weight: 100%, cluster: central }
      ]
    }
  }
}
system_account: SYS
no_auth_user: app
