# central-3: node 3 of cluster 'central'
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: central-3
listen: 127.0.0.1:4133
http: 127.0.0.1:8133

pid_file: "./data/central-3.pid"
log_file: "./data/central-3.log"

jetstream {
  store_dir: "./data/central-3"
}

cluster {
  name: central
  listen: 127.0.0.1:6133
  routes: [
    nats-route://127.0.0.1:6131
    nats-route://127.0.0.1:6132
    nats-route://127.0.0.1:6133
  ]
}

gateway {
  name: central
  listen: 127.0.0.1:7133
  # what other clusters are told to connect to: the gwproxy port in front of this listener
  advertise: 127.0.0.1:9133
  include ./gateways.conf
}

include ./accounts.conf
