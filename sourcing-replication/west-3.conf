# west-3: node 3 of cluster 'west'
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: west-3
listen: 127.0.0.1:4113
http: 127.0.0.1:8113

pid_file: "./data/west-3.pid"
log_file: "./data/west-3.log"

jetstream {
  store_dir: "./data/west-3"
}

cluster {
  name: west
  listen: 127.0.0.1:6113
  routes: [
    nats-route://127.0.0.1:6111
    nats-route://127.0.0.1:6112
    nats-route://127.0.0.1:6113
  ]
}

gateway {
  name: west
  listen: 127.0.0.1:7113
  # what other clusters are told to connect to: the gwproxy port in front of this listener
  advertise: 127.0.0.1:9113
  include ./gateways.conf
}

include ./accounts.conf
