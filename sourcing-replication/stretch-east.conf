# stretch-east: node of the 'stretch' cluster that, in a real deployment, runs in the east region (dies with east)
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: stretch-east
listen: 127.0.0.1:4141
http: 127.0.0.1:8141

pid_file: "./data/stretch-east.pid"
log_file: "./data/stretch-east.log"

jetstream {
  store_dir: "./data/stretch-east"
}

cluster {
  name: stretch
  listen: 127.0.0.1:6141
  routes: [
    nats-route://127.0.0.1:6141
    nats-route://127.0.0.1:6142
    nats-route://127.0.0.1:6143
  ]
}

gateway {
  name: stretch
  listen: 127.0.0.1:7141
  # what other clusters are told to connect to: the gwproxy port in front of this listener
  advertise: 127.0.0.1:9141
  include ./gateways.conf
}

include ./accounts.conf
