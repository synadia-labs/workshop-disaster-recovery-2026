# central-1: node 1 of cluster 'central'
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: central-1
listen: 127.0.0.1:4131
http: 127.0.0.1:8131

pid_file: "./data/central-1.pid"
log_file: "./data/central-1.log"

jetstream {
  store_dir: "./data/central-1"
}

cluster {
  name: central
  listen: 127.0.0.1:6131
  routes: [
    nats-route://127.0.0.1:6131
    nats-route://127.0.0.1:6132
    nats-route://127.0.0.1:6133
  ]
}

gateway {
  name: central
  listen: 127.0.0.1:7131
  # what other clusters are told to connect to: the gwproxy port in front of this listener
  advertise: 127.0.0.1:9131
  include ./gateways.conf
}

include ./accounts.conf
