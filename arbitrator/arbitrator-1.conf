# arbitrator-1: the only node of cluster 'arbitrator'
# It exists to give the JetStream meta group a tie-breaking 7th vote, so that
# either 'west' or 'east' can be lost entirely while a meta leader can still be elected.
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: arbitrator-1
listen: 127.0.0.1:4131
http: 127.0.0.1:8131

pid_file: "./data/arbitrator-1.pid"
log_file: "./data/arbitrator-1.log"

jetstream {
  store_dir: "./data/arbitrator-1"
  # At most one replicated (R>1) asset may be placed on this server. The meta group
  # counts as that one, so nothing else replicated can land here. (0 would mean no limit.)
  limits {
    max_ha_assets: 1
  }
}

cluster {
  name: arbitrator
  listen: 127.0.0.1:6131
  # JetStream clustering requires at least one configured route: point it at
  # this server itself (the server detects the self-route and ignores it).
  routes: [
    nats-route://127.0.0.1:6131
  ]
}

gateway {
  name: arbitrator
  listen: 127.0.0.1:7131
  # what other clusters are told to connect to: the gwproxy port in front of this listener
  advertise: 127.0.0.1:9131
  include ./gateways.conf
}

include ./accounts.conf
