# Gateway URLs of every cluster of the super-cluster (included in each server's gateway block).
# They point at gwproxy (port 91xx), which forwards to the server's real gateway port (71xx),
# so that partition-east.sh can cut the gateway links of a cluster.
gateways: [
  { name: west,       urls: [ nats://127.0.0.1:9111, nats://127.0.0.1:9112, nats://127.0.0.1:9113 ] }
  { name: east,       urls: [ nats://127.0.0.1:9121, nats://127.0.0.1:9122, nats://127.0.0.1:9123 ] }
  { name: arbitrator, urls: [ nats://127.0.0.1:9131 ] }
]
