# east-1: node 1 of cluster 'east' (hub). JetStream domain 'east'.
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: east-1
listen: 127.0.0.1:4121
http: 127.0.0.1:8121

pid_file: "./data/east-1.pid"
log_file: "./data/east-1.log"

jetstream {
  store_dir: "./data/east-1"
  domain: east
}

cluster {
  name: east
  listen: 127.0.0.1:6121
  routes: [ nats-route://127.0.0.1:6121, nats-route://127.0.0.1:6122, nats-route://127.0.0.1:6123 ]
}

# west's servers connect here as leaf nodes
leafnodes {
  listen: 127.0.0.1:7421
}

include ./accounts.conf
