# east-2: node 2 of cluster 'east' (hub). JetStream domain 'east'.
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: east-2
listen: 127.0.0.1:4122
http: 127.0.0.1:8122

pid_file: "./data/east-2.pid"
log_file: "./data/east-2.log"

jetstream {
  store_dir: "./data/east-2"
  domain: east
}

cluster {
  name: east
  listen: 127.0.0.1:6122
  routes: [ nats-route://127.0.0.1:6121, nats-route://127.0.0.1:6122, nats-route://127.0.0.1:6123 ]
}

# west's servers connect here as leaf nodes
leafnodes {
  listen: 127.0.0.1:7422
}

include ./accounts.conf
