# west-3: node 3 of cluster 'west' (leaf of east). JetStream domain 'west'.
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: west-3
listen: 127.0.0.1:4113
http: 127.0.0.1:8113

pid_file: "./data/west-3.pid"
log_file: "./data/west-3.log"

jetstream {
  store_dir: "./data/west-3"
  domain: west
}

cluster {
  name: west
  listen: 127.0.0.1:6113
  routes: [ nats-route://127.0.0.1:6111, nats-route://127.0.0.1:6112, nats-route://127.0.0.1:6113 ]
}

# leaf node connection to east, in the APP account. Each west node connects on its own;
# with separate JetStream domains, $JS.API traffic is not shared across the link, only
# the domain-prefixed APIs ($JS.east.API, $JS.west.API) and ordinary subjects.
leafnodes {
  remotes: [
    {
      urls: [ nats-leaf://app:app@127.0.0.1:7421, nats-leaf://app:app@127.0.0.1:7422, nats-leaf://app:app@127.0.0.1:7423 ]
      account: APP
    }
  ]
}

include ./accounts.conf
