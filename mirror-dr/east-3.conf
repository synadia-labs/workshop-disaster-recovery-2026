# east-3: node 3 of cluster 'east' (hub). JetStream domain 'east'.
# Relative paths are resolved from the directory nats-server is started in (this one).
server_name: east-3
listen: 127.0.0.1:4123
http: 127.0.0.1:8123

pid_file: "./data/east-3.pid"
log_file: "./data/east-3.log"

jetstream {
  store_dir: "./data/east-3"
  domain: east
}

cluster {
  name: east
  listen: 127.0.0.1:6123
  routes: [ nats-route://127.0.0.1:6121, nats-route://127.0.0.1:6122, nats-route://127.0.0.1:6123 ]
}

# west's servers connect here as leaf nodes
leafnodes {
  listen: 127.0.0.1:7423
}

include ./accounts.conf
